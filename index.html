<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My library</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="body-wrapper">

        <div class="sidebar">

            <div class="profile-wrapper">
                <img src="https://placehold.co/150x150" alt="User profile profile-picture" class="profile-picture">
                <span class="user-name">John Marsh</span>
            </div>

            <div class="form-wrapper">

                <form action="#" class="new-book-form">
                    <legend>New book</legend>

                    <div class="new-book-title">
                        <label for="book_title">Title: </label>
                        <input type="text" name="book_title" id="book_title" required />
                    </div>

                    <div class="new-book-author">
                        <label for="book_author">Author: </label>
                        <input type="text" name="book_author" id="book_author">
                    </div>

                    <button type="submit" class="btn-add-book">Add book</button>
                </form>
            </div>

            <div class="books-list-wrapper">
                    <h3>My books</h3>

                <ul class="book-list">
                    
                </ul>
            </div>

        </div>
        <div class="books-container"></div>
    </div>
</body>

</html>
