<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My library</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="body-wrapper">

        <div class="sidebar">

            <div class="profile-wrapper">
                <img src="https://placehold.co/150x150" alt="User profile profile-picture" class="profile-picture">
                <span class="user-name">John Marsh</span>
            </div>

            <div class="form-wrapper">

                <form action="#" class="initial-book-form">
                    <legend>New book</legend>

                    <div class="new-book-title">
                        <label for="initial_book_title">Title: </label>
                        <input type="text" name="initial_book_title" id="initial_book_title" />
                    </div>

                    <div class="new-book-author">
                        <label for="initial_book_author">Author: </label>
                        <input type="text" name="initial_book_author" id="initial_book_author" />
                    </div>

                    <button type="button" class="btn-add-book-form">Add</button>
                </form>
            </div>

            <div class="books-list-wrapper">
                <h3>My books</h3>

                <ul class="book-list">

                </ul>
            </div>

        </div>
        <div class="books-container"></div>
    </div>

    <dialog id="new-book-dialog">
        <form id="new-book-form">
            <legend></legend>
            <div class="form-row">
                <label for="book_title">Title:</label>
                <input type="text" name="book_title" id="book_title" autofocus />
            </div>

            <div class="form-row">
                <label for="book_author">Author:</label>
                <input type="text" name="book_author" id="book_author" />
            </div>

            <div class="form-row">
                <label for="book_pages">Pages:</label>
                <input type="text" name="book_pages" id="book_pages" inputmode="numeric" />
            </div>

            <fieldset>
                <legend>Have you read this book?</legend>

                <label for="book_status_true">
                    <input type="radio" name="book_status" id="book_status_true" value="true" />
                    Yes
                </label>

                <label for="book_status_false">
                    <input type="radio" name="book_status" id="book_status_false" value="false" checked />
                    No
                </label>
            </fieldset>

            <div class="form-row btn-wrapper">
                <button type="button" class="close-book-form" commandfor="new-book-dialog"
                    command="close">Close</button>
                <button type="button" class="close-book-form">Save</button>
            </div>
        </form>
    </dialog>
</body>

</html>
